<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/miles-tracker/favicon.png" />
    <link rel="manifest" href="/miles-tracker/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/miles-tracker/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Miles Tracker" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to real
         values; without it they are 0 and the bottom nav sits under the iOS
         home indicator in standalone mode. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>miles-tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Stale cached index.html after a new deployment can reference JS chunks
    // that no longer exist. Must be inline (before bundle loads) so it catches
    // 404s that would prevent the bundle from running at all.
    window.addEventListener('error', function(e) {
      if (e.target instanceof HTMLScriptElement) {
        window.location.replace(window.location.href);
      }
    }, true);
  </script>
  <script>
    document.addEventListener('focusout', function(e) {
      if (e.target.matches('input, textarea, select')) {
        var v = document.querySelector('meta[name=viewport]');
        if (v) {
          // Must keep viewport-fit=cover on both writes — dropping it here would
          // silently zero every safe-area inset the moment a field loses focus.
          v.content = 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover';
          requestAnimationFrame(function() {
            v.content = 'width=device-width, initial-scale=1, viewport-fit=cover';
          });
        }
      }
    });
  </script>
